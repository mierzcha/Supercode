<!DOCTYPE html>
<html>
<head>
    <title>Supercode</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	    <div id="game-board">
        <h1>Supercode</h1>
        <div id="settings">
			<label for="turn-time">Zugzeit (Sekunden):</label>
			<input type="number" id="turn-time" min="5" max="60" value="10">
			<button id="start-game" class="btn">Spiel starten</button>
		</div>
        <div id="guesses">
        </div>
        <hr>
        <div id="code-input">
            <div class="color-options">
                <div class="color-select">
                    <div class="color-display"></div>
                    <div class="color-list">
                        <div class="color-option"></div>
                        <div class="color-option" data-color="red"></div>
                        <div class="color-option" data-color="blue"></div>
                        <div class="color-option" data-color="green"></div>
                        <div class="color-option" data-color="yellow"></div>
                        <div class="color-option" data-color="brown"></div>
                    </div>
                </div>
                <div class="color-select">
                    <div class="color-display"></div>
                    <div class="color-list">
                        <div class="color-option"></div>
                        <div class="color-option" data-color="red"></div>
                        <div class="color-option" data-color="blue"></div>
                        <div class="color-option" data-color="green"></div>
                        <div class="color-option" data-color="yellow"></div>
                        <div class="color-option" data-color="brown"></div>
                    </div>
                </div>
                <div class="color-select">
                    <div class="color-display"></div>
                    <div class="color-list">
                        <div class="color-option"></div>
                        <div class="color-option" data-color="red"></div>
                        <div class="color-option" data-color="blue"></div>
                        <div class="color-option" data-color="green"></div>
                        <div class="color-option" data-color="yellow"></div>
                        <div class="color-option" data-color="brown"></div>
                    </div>
                </div>
                <div class="color-select">
                    <div class="color-display"></div>
                    <div class="color-list">
                        <div class="color-option"></div>
                        <div class="color-option" data-color="red"></div>
                        <div class="color-option" data-color="blue"></div>
                        <div class="color-option" data-color="green"></div>
                        <div class="color-option" data-color="yellow"></div>
                        <div class="color-option" data-color="brown"></div>
                    </div>
                </div>
            </div>
          
            <button id="submit-guess" class="btn">Submit Guess</button>
            <button id="restart-game" class="btn">Restart Game</button>

        </div>
    </div>
    <div id="result"></div>
    <script src="script.js"></script>
</body>
</html>
